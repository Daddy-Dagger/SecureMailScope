services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      SECUREMAILSCOPE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
